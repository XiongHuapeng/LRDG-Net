[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrdg-net"
version = "1.0.0"
description = "Paper-aligned implementation of LRDG-Net for LiDAR cover contamination recognition"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Huapeng Xiong"},
  {name = "Zhongwen Pei"},
  {name = "Guanyu Zhang"},
  {name = "Shaoan Lu"},
  {name = "Zhijun Wu", email = "zjwu@tongji.edu.cn"},
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "torch>=2.1,<3",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
autogran = ["torch-geometric"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lrdg-net = "lrdg_net.cli:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lrdg_net*", "paper_experiments*", "tools*"]
exclude = ["tests*", "docs*", "data*", "assets*", "reference_results*"]

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["paper_experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
